# Tutorial 05: arquitectura de tres capas.
#   Internet -> Nginx (80) -> Gunicorn/Django (8000, solo red interna) -> PostgreSQL
# Prueba local: docker compose up --build  ->  http://localhost/api/v1/comprar/

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    # CAMBIO 1: Gunicorn en lugar de runserver. 'Tienda' es la carpeta del wsgi.py.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py cargar_demo &&
             gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
    # Ya no hay sección 'ports': Django queda aislado, solo Nginx le habla.

  # CAMBIO 2: Nginx, único servicio expuesto a internet
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:

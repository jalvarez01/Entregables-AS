# Tutorial 05: Nginx como proxy inverso delante de Django + Gunicorn.

# Registro de acceso que incluye a qué backend se envió cada petición
# ($upstream_addr). Sirve como evidencia del enrutamiento con
# "docker compose logs nginx".
log_format ruteo '$remote_addr "$request" $status -> upstream=$upstream_addr '
                 '($upstream_response_time s)';

# 1. Backend Django + Gunicorn. 'web' es el nombre del servicio en docker-compose.
upstream django_backend {
    server web:8000;
}

server {
    # Nginx escucha en el puerto web estándar
    listen 80;

    access_log /var/log/nginx/access.log ruteo;

    # Ignorar logs de favicon para no saturar el servidor
    location = /favicon.ico { access_log off; log_not_found off; }

    # 2. Proxy inverso: todo el tráfico va a Django
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Nota arquitectónica: en el Tutorial 06 se agrega aquí
    # 'location /api/v2/' apuntando al microservicio Flask (Strangler Pattern).
}

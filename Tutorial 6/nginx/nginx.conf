# Tutorial 06: Strangler Pattern.
# Nginx decide a qué sistema va cada petición según la versión de la API.

# Registro que muestra a qué backend se envió cada petición ($upstream_addr).
# Evidencia: docker compose logs nginx
log_format ruteo '$remote_addr "$request" $status -> upstream=$upstream_addr '
                 '($upstream_response_time s)';

# El monolito (v1)
upstream django_v1 {
    server web_django:8000;
}

# El estrangulador (v2)
upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log ruteo;

    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA VIEJA: sigue yendo a Django
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RUTA NUEVA: la compra se estrangula y se manda a Flask
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # El resto del monolito (inventario HTML, admin, estáticos) sigue en Django
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
